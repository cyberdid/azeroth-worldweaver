<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
<title id="t">Azeroth Worldweaver system flow</title><desc id="d">Claude and Codex share server telemetry and session memory. Authorized chat becomes a typed action dispatched through AzerothCore and mod-playerbots, while the server reports observed outcomes. Collection and player-approved trade are separate.</desc>
<defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0c1b28"/><stop offset="1" stop-color="#142e3a"/></linearGradient><linearGradient id="a"><stop stop-color="#64dcc5"/><stop offset="1" stop-color="#edc477"/></linearGradient><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#69d6c1"/></marker></defs>
<rect width="1200" height="650" rx="26" fill="url(#g)"/><text x="600" y="54" fill="#f4ecd8" text-anchor="middle" font-family="Georgia,serif" font-size="33">One shared world. Actions with receipts.</text>
<g font-family="sans-serif" text-anchor="middle">
<g><rect x="60" y="126" width="250" height="142" rx="18" fill="#172e3b" stroke="#69d6c1" stroke-width="2"/><text x="185" y="174" fill="#f6f1e6" font-size="25">Claude + Codex</text><text x="185" y="211" fill="#b8cbd0" font-size="17">natural conversation</text><text x="185" y="240" fill="#b8cbd0" font-size="17">session memory</text></g>
<g><rect x="476" y="126" width="250" height="142" rx="18" fill="#172e3b" stroke="#d7b56d" stroke-width="2"/><text x="601" y="174" fill="#f6f1e6" font-size="25">Worldweaver bridge</text><text x="601" y="211" fill="#b8cbd0" font-size="17">allowlisted chat</text><text x="601" y="240" fill="#b8cbd0" font-size="17">typed, validated actions</text></g>
<g><rect x="892" y="126" width="250" height="142" rx="18" fill="#172e3b" stroke="#69d6c1" stroke-width="2"/><text x="1017" y="174" fill="#f6f1e6" font-size="25">AzerothCore</text><text x="1017" y="211" fill="#b8cbd0" font-size="17">mod-playerbots APIs</text><text x="1017" y="240" fill="#b8cbd0" font-size="17">server-authoritative world</text></g>
<path d="M310 196h153M726 196h153" fill="none" stroke="url(#a)" stroke-width="4" marker-end="url(#m)"/><path d="M1017 286v71H185v-71" fill="none" stroke="#69d6c1" stroke-width="3" marker-end="url(#m)"/><text x="600" y="386" fill="#9dc3c7" font-size="18">snapshots · events · action results · observed inventory</text>
<rect x="73" y="447" width="330" height="126" rx="16" fill="#182c38" stroke="#3e7880"/><text x="238" y="485" fill="#efdfb9" font-size="21">Hunt &amp; gather</text><text x="238" y="519" fill="#bfd0d2" font-size="16">kills → normal corpse loot → bags</text><text x="238" y="546" fill="#bfd0d2" font-size="16">task targets / zones / regions</text>
<rect x="435" y="447" width="330" height="126" rx="16" fill="#182c38" stroke="#a8894e"/><text x="600" y="485" fill="#efdfb9" font-size="21">Trade is separate</text><text x="600" y="519" fill="#bfd0d2" font-size="16">only when explicitly requested</text><text x="600" y="546" fill="#bfd0d2" font-size="16">server confirms; player accepts</text>
<rect x="797" y="447" width="330" height="126" rx="16" fill="#182c38" stroke="#3e7880"/><text x="962" y="485" fill="#efdfb9" font-size="21">Boundaries</text><text x="962" y="519" fill="#bfd0d2" font-size="16">loaded world ≠ omniscience</text><text x="962" y="546" fill="#bfd0d2" font-size="16">telemetry ≠ screen capture</text>
</g></svg>
